name: Release

# Creates the tag and the GitHub release when the version in manifest.json
# changes on main. The release notes are the matching section of the changelogs.
on:
  push:
    branches: [main]
    paths:
      - custom_components/kostal/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: echo "version=$(jq -r .version custom_components/kostal/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check whether the release exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the release notes
        if: steps.exists.outputs.exists == 'false'
        run: |
          section() {  # print the changelog section of this version without its heading
            awk -v v="## ${{ steps.version.outputs.version }} " 'index($0, v) == 1 {found=1; next} /^## / {found=0} found' "$1"
          }
          {
            section CHANGELOG.en.md
            printf '\n---\n\n**Deutsch**\n'
            section CHANGELOG.md
          } > notes.md
          if ! grep -q '[^[:space:]-]' notes.md; then
            echo "No changelog section for ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Create the release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file notes.md
